name: Live demo

# Publishes the in-browser live demo (frontend built with `--mode demo`) to
# GitHub Pages on every push to main. The demo runs the real contract on an EVM
# inside the visitor's browser, so it needs no RPC endpoint, wallet or server.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:demo
        working-directory: frontend
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true
          commit_message: "deploy: live demo"
