name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts · lint, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
        env:
          FUZZ_RUNS: 40
      - run: npm run coverage
      - name: Gas report
        run: npm run test:gas > gas-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-and-gas
          path: |
            coverage/
            gas-report.txt

  frontend:
    name: dApp · typecheck & build
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      # Generates the ABI and a deployment file so the dApp can be type-checked and built.
      - name: Export ABI via in-process deploy
        run: npx hardhat run scripts/deploy.js
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  slither:
    name: Static analysis · Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: crytic/slither-action@v0.4.2
        id: slither
        with:
          node-version: 22
          fail-on: medium
          slither-args: --filter-paths "node_modules|contracts/mocks|contracts/legacy"
          sarif: results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif: ${{ steps.slither.outputs.sarif }}
